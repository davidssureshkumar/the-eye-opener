# Build and publish to GitHub Pages.
#
# The site is static: this job runs the same `verify` gate as a local checkout, builds
# with Vite and uploads `dist/`. Nothing is generated at request time and no secret is
# needed, because there is no backend to hold one.
#
# `base: './'` in vite.config.ts is what makes the same `dist/` work on a project page
# (/<repo>/), a user page (/), Netlify, Vercel or an S3 prefix without a rebuild.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Format, lint, typecheck and the DSP test suite. A course whose physics tests
      # fail has no business being published.
      - run: npm run verify
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
